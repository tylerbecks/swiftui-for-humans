# ---------------------------------------------------------------- Animation and layout

- id: animation-without-value
  old: '.animation(.spring())'
  new: '.animation(.spring(), value: isExpanded), or withAnimation { ... } where the state changes'
  brief: '`.animation(_:)` → `.animation(_:value:)` / `withAnimation`'
  why: 'The value-less animation modifier was deprecated in iOS 15 and animates unrelated changes.'
  min_os: 'iOS 13, macOS 10.15'
  severity: error
  regex: '(?<![\w\]])\.animation\s*\(\s*(?:nil|(?:Animation)?\.\w+(?:\([^()\n]*\))?(?:\.\w+(?:\([^()\n]*\))?)*)\s*\)(?!\s*\{)'
  docs: https://developer.apple.com/documentation/swiftui/view/animation(_:value:).md
  example_old: |
    Circle().scaleEffect(isOn ? 1.2 : 1).animation(.easeInOut)
  example_new: |
    struct Pulse: View {
        @State private var isOn = false

        var body: some View {
            VStack {
                Circle()
                    .frame(width: 60, height: 60)
                    .scaleEffect(isOn ? 1.2 : 1)
                    .animation(.easeInOut, value: isOn)
                Button("Pulse") { isOn.toggle() }
            }
