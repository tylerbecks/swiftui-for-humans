  regex: '\.frame\s*\(\s*(?:width|height)\s*:\s*\w+\.size\.(?:width|height)\s*[*/]'
  docs: https://developer.apple.com/documentation/swiftui/view/containerrelativeframe(_:alignment:).md
  example_old: |
    GeometryReader { geo in
        Card().frame(width: geo.size.width * 0.8)
    }
  example_new: |
    struct Carousel: View {
        var body: some View {
            ScrollView(.horizontal) {
                LazyHStack {
                    ForEach(0..<5) { number in
