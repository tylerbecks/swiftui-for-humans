- id: geometry-reader-size-hack
  old: '.background(GeometryReader { proxy in Color.clear.preference(key: SizeKey.self, value: proxy.size) })'
  new: '.onGeometryChange(for: CGSize.self) { $0.size } action: { size = $0 }'
  brief: '`.background(GeometryReader…)` size hack → `.onGeometryChange`'
  why: 'onGeometryChange reads a size without a preference key or an extra layout pass.'
  min_os: 'iOS 16, macOS 13'
  severity: warning
  regex: '\.(?:background|overlay)\s*[({]\s*GeometryReader\b'
  multiline: true
  docs: https://developer.apple.com/documentation/swiftui/view/ongeometrychange(for:of:action:).md
  example_old: |
    Text("Hello")
        .background(
            GeometryReader { proxy in
                Color.clear.preference(key: WidthKey.self, value: proxy.size.width)
            }
        )
  example_new: |
    struct MeasuredLabel: View {
        @State private var width: CGFloat = 0

        var body: some View {
            Text("Hello, \(Int(width)) points")
                .onGeometryChange(for: CGFloat.self) { proxy in
                    proxy.size.width
                } action: { newWidth in
                    width = newWidth
                }
        }
    }

- id: geometry-proportional-frame
  old: 'GeometryReader { geo in Card().frame(width: geo.size.width * 0.8) }'
  new: '.containerRelativeFrame(.horizontal) { width, _ in width * 0.8 }'
  brief: '`GeometryReader` + `size.width * k` → `.containerRelativeFrame`'
  why: 'containerRelativeFrame sizes against the scroll view or window without GeometryReader taking all the space.'
  min_os: 'iOS 17, macOS 14'
