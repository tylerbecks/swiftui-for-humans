- id: file-document
  old: 'struct TextFile: FileDocument { init(configuration: ReadConfiguration) ... }'
  new: 'On 27+: an @Observable class conforming to Document (ReadableDocument & WritableDocument)'
  brief: '`FileDocument` → `Document` (`ReadableDocument` & `WritableDocument`)'
  why: 'FileDocument is deprecated in the 27 SDK; Document reads from a URL, so large files never load whole into memory.'
  min_os: 'iOS 27, macOS 27'
  severity: info
  regex: ':\s*(?:[\w.]+\s*,\s*)*(?:Reference)?FileDocument\b'
  docs: https://developer.apple.com/documentation/swiftui/document.md
  example_old: |
    struct TextFile: FileDocument {
        static var readableContentTypes: [UTType] { [.plainText] }
    }
  example_new: |
    import UniformTypeIdentifiers

    @available(iOS 27, macOS 27, *)
    @Observable
    final class NoteDocument: Document {
        typealias Reader = FileWrapperDocumentReader<String>
        typealias Writer = FileWrapperDocumentWriter<String>

        static let readableContentTypes: [UTType] = [.plainText]
        var text = ""

        func reader(configuration: sending ReadConfiguration) -> sending Reader {
            Reader(configuration) { wrapper in
                String(decoding: wrapper.regularFileContents ?? Data(), as: UTF8.self)
            }
        }

        func apply(snapshot: sending String, previous: sending String?) async throws {
            text = snapshot
        }

        func writer(configuration: sending WriteConfiguration) -> sending Writer {
            Writer(configuration) { snapshot, _ in
                FileWrapper(regularFileWithContents: Data(snapshot.utf8))
            }
        }

        func snapshot(contentType: UTType) async throws -> sending String {
            text
        }
    }
