# Corrections: SwiftUI code that models still write, and what to write instead.
#
# One source for the primer, the skills' top rules, check-swift.sh, and the MCP server.
# Checked against the iOS 27.1 / macOS 27.0 SDK interfaces (Xcode 27) and Apple's
# documentation in October 2026.
#
# Fields
#   id           unique kebab-case id, also the linter's rule name
#   old          the outdated or deprecated form
#   new          what to write instead
#   brief        old → new in a few words, for tables and the primer
#   why          one line
#   min_os       the oldest OS where `new` works ("any" means every supported OS)
#   severity     error   = deprecated, and the compiler already warns
#                warning = deprecated by Apple (some only in the docs so far) or clearly superseded
#                info    = a judgment call: often wrong, sometimes fine
#   regex        Python regex matched against Swift source with comments and string
#                contents blanked. One line at a time unless `multiline: true`.
#   multiline    optional; match across lines (whole file)
#   file_requires optional regex the file must also contain
#   unless_near  optional regex; skip a match when it appears on the same line or up to 6 lines above
#   platforms    optional; where example_new compiles: all (default), ios, or macos
#   docs         Apple documentation for `new` (the .md form)
#   example_old  code the linter must flag (never compiled)
#   example_new  complete Swift declarations that build in the repo's snippet check
#
# This file is a YAML subset (a list of flat maps; scalars, single-quoted strings,
# and `|` blocks) so the linter can read it with the Python standard library.

# ---------------------------------------------------------------- Navigation

- id: navigation-view
  old: 'NavigationView'
  new: 'NavigationStack, or NavigationSplitView for a sidebar and columns'
  brief: '`NavigationView` → `NavigationStack` / `NavigationSplitView`'
  why: 'NavigationView is deprecated; the new containers support value-based, programmatic navigation.'
  min_os: 'iOS 16, macOS 13'
  severity: warning
  regex: '\bNavigationView\b'
  docs: https://developer.apple.com/documentation/swiftui/navigationstack.md
  example_old: |
    NavigationView {
        List(items) { Text($0.name) }
    }
  example_new: |
    struct FruitList: View {
        var body: some View {
            NavigationStack {
                List {
                    NavigationLink("Apples", value: "Apples")
                    NavigationLink("Pears", value: "Pears")
                }
                .navigationTitle("Fruit")
                .navigationDestination(for: String.self) { Text($0) }
            }
        }
    }

- id: navigation-view-style
  old: '.navigationViewStyle(.stack)'
  new: 'Delete it, and pick NavigationStack or NavigationSplitView directly'
  brief: '`.navigationViewStyle(_:)` → delete; pick the container'
  why: 'Navigation view styles only configure the deprecated NavigationView.'
  min_os: 'iOS 16, macOS 13'
  severity: warning
  regex: '\.navigationViewStyle\s*\('
  docs: https://developer.apple.com/documentation/swiftui/navigationsplitview.md
  example_old: |
    NavigationView { Sidebar() }
        .navigationViewStyle(.stack)
  example_new: |
    enum Mailbox: String, CaseIterable, Identifiable {
        case inbox, sent
        var id: Self { self }
    }

    struct MailSidebar: View {
        @State private var selection: Mailbox?

        var body: some View {
            NavigationSplitView {
                List(Mailbox.allCases, selection: $selection) { Text($0.rawValue.capitalized) }
            } detail: {
                Text(selection?.rawValue.capitalized ?? "Select a mailbox")
            }
        }
    }

- id: navigation-link-is-active
  old: 'NavigationLink(destination:isActive:) or NavigationLink(tag:selection:)'
  new: '.navigationDestination(isPresented:) or NavigationLink(value:) with .navigationDestination(for:)'
  brief: '`NavigationLink(isActive:)` / `(tag:selection:)` → `.navigationDestination(isPresented:)` / `NavigationLink(value:)`'
  why: 'The binding-driven NavigationLink initializers were deprecated in iOS 16 and break deep links.'
  min_os: 'iOS 16, macOS 13'
  severity: error
  regex: '\bNavigationLink\s*\([^\n]*?\b(?:isActive|tag)\s*:'
  docs: https://developer.apple.com/documentation/swiftui/view/navigationdestination(ispresented:destination:).md
  example_old: |
    NavigationLink(destination: Detail(), isActive: $showDetail) { EmptyView() }
  example_new: |
    struct Checkout: View {
        @State private var showReceipt = false

        var body: some View {
            NavigationStack {
                Button("Pay") { showReceipt = true }
                    .navigationDestination(isPresented: $showReceipt) {
                        Text("Receipt")
                    }
            }
        }
    }

- id: navigation-bar-title
  old: '.navigationBarTitle("Title", displayMode: .inline)'
  new: '.navigationTitle("Title") plus .navigationBarTitleDisplayMode(.inline) on iOS'
  brief: '`.navigationBarTitle` → `.navigationTitle` + `.navigationBarTitleDisplayMode`'
  why: 'navigationBarTitle is deprecated and iOS-only; navigationTitle works on every platform.'
  min_os: 'iOS 14, macOS 11'
  severity: warning
  regex: '\.navigationBarTitle\s*\('
  platforms: ios
  docs: https://developer.apple.com/documentation/swiftui/view/navigationtitle(_:).md
  example_old: |
    List { Text("Row") }
        .navigationBarTitle("Settings", displayMode: .inline)
  example_new: |
    struct SettingsScreen: View {
        var body: some View {
            List { Text("Row") }
                .navigationTitle("Settings")
                .navigationBarTitleDisplayMode(.inline)
        }
    }

- id: navigation-bar-items
  old: '.navigationBarItems(trailing: Button(...))'
  new: '.toolbar { ToolbarItem(placement: .topBarTrailing) { ... } }'
  brief: '`.navigationBarItems` → `.toolbar { ToolbarItem }`'
  why: 'navigationBarItems is deprecated; toolbar items adapt to every platform and get Liquid Glass.'
  min_os: 'iOS 14, macOS 11'
  severity: warning
  regex: '\.navigationBarItems\s*\('
  platforms: ios
  docs: https://developer.apple.com/documentation/swiftui/view/toolbar(content:)-5w0tj.md
  example_old: |
    List { Text("Row") }
        .navigationBarItems(trailing: Button("Add") { add() })
  example_new: |
    struct NotesList: View {
        @State private var count = 0

        var body: some View {
            List { Text("\(count) notes") }
                .toolbar {
                    ToolbarItem(placement: .topBarTrailing) {
                        Button("Add Note", systemImage: "plus") { count += 1 }
                    }
                }
        }
    }

- id: navigation-bar-placement
  old: 'ToolbarItem(placement: .navigationBarTrailing)'
  new: '.topBarTrailing / .topBarLeading (or .primaryAction for a cross-platform main action)'
  brief: '`.navigationBarLeading/Trailing` → `.topBarLeading/Trailing`'
  why: 'The navigationBar placements are deprecated in favor of the topBar names.'
  min_os: 'iOS 14'
  severity: warning
  regex: '\.navigationBar(?:Leading|Trailing)\b'
  platforms: ios
  docs: https://developer.apple.com/documentation/swiftui/toolbaritemplacement/topbartrailing.md
  example_old: |
    .toolbar {
        ToolbarItem(placement: .navigationBarTrailing) { EditButton() }
    }
  example_new: |
    struct EditableList: View {
        var body: some View {
            List { Text("Row") }
                .toolbar {
                    ToolbarItem(placement: .topBarTrailing) { EditButton() }
                }
        }
    }

- id: navigation-bar-hidden
  old: '.navigationBarHidden(true)'
  new: '.toolbarVisibility(.hidden, for: .navigationBar)'
  brief: '`.navigationBarHidden(true)` → `.toolbarVisibility(.hidden, for: .navigationBar)`'
  why: 'navigationBarHidden is deprecated; toolbarVisibility names the bar it hides.'
  min_os: 'iOS 18'
  severity: warning
  regex: '\.navigationBarHidden\s*\('
  platforms: ios
  docs: https://developer.apple.com/documentation/swiftui/view/toolbarvisibility(_:for:).md
  example_old: |
    PlayerView()
        .navigationBarHidden(true)
  example_new: |
    struct PlayerScreen: View {
        var body: some View {
            Color.black
                .toolbarVisibility(.hidden, for: .navigationBar)
        }
    }

- id: tab-item
  old: 'View().tabItem { Label("Home", systemImage: "house") }'
  new: 'Tab("Home", systemImage: "house") { View() } inside TabView'
  brief: '`.tabItem { }` → `Tab("Title", systemImage:) { }`'
  why: 'tabItem is deprecated; Tab supports selection values, roles like .search, sections, and the iPad sidebar.'
  min_os: 'iOS 18, macOS 15'
  severity: warning
  regex: '\.tabItem\s*[({]'
  docs: https://developer.apple.com/documentation/swiftui/tab.md
  example_old: |
    TabView {
        HomeView().tabItem { Label("Home", systemImage: "house") }
    }
  example_new: |
    struct RootTabs: View {
        var body: some View {
            TabView {
                Tab("Home", systemImage: "house") { Text("Home") }
                Tab("Settings", systemImage: "gear") { Text("Settings") }
            }
        }
    }

- id: presentation-mode
  old: '@Environment(\.presentationMode) var presentationMode'
  new: '@Environment(\.dismiss) private var dismiss, then dismiss()'
  brief: '`\.presentationMode` → `\.dismiss`'
  why: 'presentationMode is deprecated; dismiss closes sheets and pops pushed views.'
  min_os: 'iOS 15, macOS 12'
  severity: warning
  regex: '\\\.presentationMode\b|\bpresentationMode\.wrappedValue\b'
  docs: https://developer.apple.com/documentation/swiftui/environmentvalues/dismiss.md
  example_old: |
    @Environment(\.presentationMode) var presentationMode
    Button("Close") { presentationMode.wrappedValue.dismiss() }
  example_new: |
    struct EditSheet: View {
        @Environment(\.dismiss) private var dismiss

        var body: some View {
            Button("Done") { dismiss() }
        }
    }

# ---------------------------------------------------------------- Presentation

- id: action-sheet
  old: '.actionSheet(isPresented:) { ActionSheet(...) }'
  new: '.confirmationDialog("Title", isPresented:) { Button(...) }'
  brief: '`ActionSheet` / `.actionSheet` → `.confirmationDialog`'
  why: 'ActionSheet is deprecated; confirmationDialog takes ordinary Buttons with roles and adapts per platform.'
  min_os: 'iOS 15, macOS 12'
  severity: warning
  regex: '\.actionSheet\s*\(|\bActionSheet\s*\('
  docs: https://developer.apple.com/documentation/swiftui/view/confirmationdialog(_:ispresented:titlevisibility:actions:).md
  example_old: |
    .actionSheet(isPresented: $showOptions) {
        ActionSheet(title: Text("Discard draft?"), buttons: [.destructive(Text("Discard")), .cancel()])
    }
  example_new: |
    struct DraftToolbar: View {
        @State private var isConfirming = false

        var body: some View {
            Button("Close Draft") { isConfirming = true }
                .confirmationDialog("Close this draft?", isPresented: $isConfirming) {
                    Button("Delete Draft", role: .destructive) { }
                    Button("Save Draft") { }
                }
        }
    }

- id: alert-struct
  old: '.alert(isPresented:) { Alert(title:message:dismissButton:) }'
  new: '.alert("Title", isPresented:) { Button(...) } message: { Text(...) }'
  brief: '`Alert(title:)` → `.alert(_:isPresented:actions:message:)`'
  why: 'The Alert struct is deprecated; the modifier form takes Buttons with roles and a message view.'
  min_os: 'iOS 15, macOS 12'
  severity: warning
  regex: '\bAlert\s*\(\s*title\s*:|\bAlert\.Button\b'
  docs: https://developer.apple.com/documentation/swiftui/view/alert(_:ispresented:actions:message:).md
  example_old: |
    .alert(isPresented: $showError) {
        Alert(title: Text("Error"), message: Text("Try again"), dismissButton: .default(Text("OK")))
    }
  example_new: |
    struct SaveButton: View {
        @State private var showError = false

        var body: some View {
            Button("Save") { showError = true }
                .alert("Couldn't Save", isPresented: $showError) {
                    Button("Try Again") { }
                    Button("Cancel", role: .cancel) { }
                } message: {
                    Text("Check your connection, then try again.")
                }
        }
    }

# ---------------------------------------------------------------- Data flow

- id: observable-object
  old: 'class Model: ObservableObject { @Published var name = "" }'
  new: '@Observable class Model { var name = "" }'
  brief: '`ObservableObject` → `@Observable`'
  why: 'With Observation, views update only for the properties they read, and no wrappers are needed.'
  min_os: 'iOS 17, macOS 14'
  severity: warning
  regex: '\bclass\s+\w+(?:<[^>\n]*>)?\s*:[^{\n]*\bObservableObject\b'
  docs: https://developer.apple.com/documentation/observation/observable().md
  example_old: |
    final class Library: ObservableObject {
        var books: [String] = []
    }
  example_new: |
    @Observable
    final class Library {
        var books: [String] = []
    }

- id: published
  old: '@Published var books: [Book] = []'
  new: 'A plain var inside an @Observable class'
  brief: '`@Published var` → plain `var` in an `@Observable` class'
  why: '@Published belongs to ObservableObject; @Observable tracks stored properties on its own.'
  min_os: 'iOS 17, macOS 14'
  severity: warning
  regex: '@Published\b'
  docs: https://developer.apple.com/documentation/observation/observable().md
  example_old: |
    @Published var books: [String] = []
  example_new: |
    @Observable
    final class Shelf {
        var books: [String] = []
        var isLoading = false
    }

- id: state-object
  old: '@StateObject private var model = Model()'
  new: '@State private var model = Model() with an @Observable model'
  brief: '`@StateObject` → `@State`'
  why: '@State owns @Observable objects; @StateObject only exists for ObservableObject.'
  min_os: 'iOS 17, macOS 14'
  severity: warning
  regex: '@StateObject\b'
  docs: https://developer.apple.com/documentation/swiftui/state.md
  example_old: |
    @StateObject private var library = Library()
  example_new: |
    @Observable
    final class Counter {
        var value = 0
    }

    struct CounterView: View {
        @State private var counter = Counter()

        var body: some View {
            Button("Count: \(counter.value)") { counter.value += 1 }
        }
    }

- id: observed-object
  old: '@ObservedObject var model: Model'
  new: 'let model: Model (or @Bindable var model: Model when you need $bindings)'
  brief: '`@ObservedObject` → plain property, or `@Bindable`'
  why: 'Views track @Observable objects they read automatically; @Bindable adds bindings.'
  min_os: 'iOS 17, macOS 14'
  severity: warning
  regex: '@ObservedObject\b'
  docs: https://developer.apple.com/documentation/swiftui/bindable.md
  example_old: |
    @ObservedObject var profile: Profile
  example_new: |
    @Observable
    final class Profile {
        var name = ""
    }

    struct ProfileEditor: View {
        @Bindable var profile: Profile

        var body: some View {
            TextField("Name", text: $profile.name)
        }
    }

- id: environment-object
  old: '@EnvironmentObject var settings: Settings'
  new: '@Environment(Settings.self) private var settings'
  brief: '`@EnvironmentObject` → `@Environment(Model.self)`'
  why: 'Observable objects go in the environment by type; there is no wrapper or ObservableObject needed.'
  min_os: 'iOS 17, macOS 14'
  severity: warning
  regex: '@EnvironmentObject\b'
  docs: https://developer.apple.com/documentation/swiftui/environment.md
  example_old: |
    @EnvironmentObject var settings: AppSettings
  example_new: |
    @Observable
    final class AppSettings {
        var showsBadges = true
    }

    struct BadgeToggle: View {
        @Environment(AppSettings.self) private var settings

        var body: some View {
            @Bindable var settings = settings
            Toggle("Show Badges", isOn: $settings.showsBadges)
        }
    }

- id: environment-object-modifier
  old: '.environmentObject(settings)'
  new: '.environment(settings)'
  brief: '`.environmentObject(x)` → `.environment(x)`'
  why: 'environment(_:) injects an @Observable object for @Environment(Type.self) to read.'
  min_os: 'iOS 17, macOS 14'
  severity: warning
  regex: '\.environmentObject\s*\('
  docs: https://developer.apple.com/documentation/swiftui/view/environment(_:).md
  example_old: |
    ContentView()
        .environmentObject(settings)
  example_new: |
    @Observable
    final class Session {
        var userName = "Sam"
    }

    struct SessionRoot: View {
        @State private var session = Session()

        var body: some View {
            Greeting()
                .environment(session)
        }
    }

    struct Greeting: View {
        @Environment(Session.self) private var session

        var body: some View {
            Text("Hello, \(session.userName)")
        }
    }

- id: state-not-private
  old: '@State var count = 0'
  new: '@State private var count = 0'
  brief: '`@State var` → `@State private var`'
  why: 'State belongs to the view; a non-private @State invites callers to pass a value that SwiftUI then ignores.'
  min_os: 'any'
  severity: info
  regex: '(?<!@Previewable )@State\s+(?!private\b|fileprivate\b)(?:var|let)\b'
  docs: https://developer.apple.com/documentation/swiftui/state.md
  example_old: |
    @State var count = 0
  example_new: |
    struct CountStepper: View {
        @State private var count = 0

        var body: some View {
            Stepper("Count: \(count)", value: $count)
        }
    }

- id: on-change-single-parameter
  old: '.onChange(of: value) { newValue in ... }'
  new: '.onChange(of: value) { oldValue, newValue in ... } or .onChange(of: value) { ... }'
  brief: '`.onChange(of:) { new in }` → `{ old, new in }` or `{ }`'
  why: 'The one-parameter onChange was deprecated in iOS 17; use the two- or zero-parameter closure.'
  min_os: 'iOS 17, macOS 14'
  severity: error
  regex: '\.onChange\s*\(\s*of\s*:[^\n]*?\)\s*\{\s*(?:\w+|_)\s+in\b|\.onChange\s*\(\s*of\s*:[^\n]*,\s*perform\s*:'
  docs: https://developer.apple.com/documentation/swiftui/view/onchange(of:initial:_:).md
  example_old: |
    .onChange(of: query) { newValue in
        search(newValue)
    }
  example_new: |
    struct SearchBox: View {
        @State private var query = ""
        @State private var lastChange = ""

        var body: some View {
            TextField("Search", text: $query)
                .onChange(of: query) { oldValue, newValue in
                    lastChange = "\(oldValue) to \(newValue)"
                }
        }
    }

- id: dispatch-main-async
  old: 'DispatchQueue.main.async { self.items = loaded }'
  new: 'async/await in .task { }, with UI state on the main actor'
  brief: '`DispatchQueue.main.async` in views → `.task { }` + async/await'
  why: 'Views and @Observable models are main-actor code; GCD hops hide data races that Swift 6 checks for.'
  min_os: 'any'
  severity: warning
  regex: '\bDispatchQueue\.main\.async\b(?!After)'
  file_requires: '\bimport\s+SwiftUI\b'
  docs: https://developer.apple.com/documentation/swift/task.md
  example_old: |
    import SwiftUI
    URLSession.shared.dataTask(with: url) { data, _, _ in
        DispatchQueue.main.async { self.data = data }
    }.resume()
  example_new: |
    struct FeedView: View {
        @State private var byteCount = 0

        var body: some View {
            Text("\(byteCount) bytes")
                .task {
                    let url = URL(string: "https://www.apple.com")!
                    if let (data, _) = try? await URLSession.shared.data(from: url) {
                        byteCount = data.count
                    }
                }
        }
    }

- id: dispatch-async-after
  old: 'DispatchQueue.main.asyncAfter(deadline: .now() + 2) { ... }'
  new: 'try await Task.sleep(for: .seconds(2)) inside .task, which cancels when the view goes away'
  brief: '`DispatchQueue.main.asyncAfter` → `Task.sleep(for:)` in `.task`'
  why: 'A delayed GCD block keeps running after the view is gone and ignores cancellation.'
  min_os: 'iOS 16, macOS 13'
  severity: warning
  regex: '\bDispatchQueue\.main\.asyncAfter\b'
  docs: https://developer.apple.com/documentation/swift/task/sleep(for:tolerance:clock:).md
  example_old: |
    DispatchQueue.main.asyncAfter(deadline: .now() + 2) { showHint = true }
  example_new: |
    struct HintView: View {
        @State private var showHint = false

        var body: some View {
            Text(showHint ? "Tip: swipe to archive" : "")
                .task {
                    try? await Task.sleep(for: .seconds(2))
                    showHint = true
                }
        }
    }

- id: task-in-on-appear
  old: '.onAppear { Task { await load() } }'
  new: '.task { await load() }'
  brief: '`.onAppear { Task { } }` → `.task { }`'
  why: '.task cancels the work when the view disappears; a Task started in onAppear keeps running.'
  min_os: 'iOS 15, macOS 12'
  severity: warning
  regex: '\.onAppear\s*\{\s*Task\s*[({]'
  multiline: true
  docs: https://developer.apple.com/documentation/swiftui/view/task(name:priority:file:line:_:).md
  example_old: |
    .onAppear {
        Task { await model.load() }
    }
  example_new: |
    struct ArticleView: View {
        @State private var title = "Loading…"

        var body: some View {
            Text(title)
                .task {
                    try? await Task.sleep(for: .milliseconds(200))
                    title = "Loaded"
                }
        }
    }

- id: foreach-id-self
  old: 'ForEach(items, id: \.self)'
  new: 'Make the element Identifiable with a stable id, then ForEach(items)'
  brief: '`ForEach(items, id: \.self)` → `Identifiable` items'
  why: 'id: \.self is only safe for unique, unchanging values; duplicates and edits break animation and state.'
  min_os: 'any'
  severity: info
  regex: '\b(?:ForEach|List)\s*\([^\n]*\bid\s*:\s*\\\.self\b'
  docs: https://developer.apple.com/documentation/swiftui/foreach.md
  example_old: |
    ForEach(tasks, id: \.self) { task in Text(task.title) }
  example_new: |
    struct TodoItem: Identifiable {
        let id = UUID()
        var title: String
    }

    struct TodoList: View {
        @State private var todos = [TodoItem(title: "Buy milk")]

        var body: some View {
            List(todos) { todo in
                Text(todo.title)
            }
        }
    }

- id: foreach-indices
  old: 'ForEach(items.indices, id: \.self) { i in Text(items[i].name) }'
  new: 'ForEach(items) { item in ... }, or ForEach($items) { $item in ... } for bindings'
  brief: '`ForEach(items.indices)` → `ForEach(items)` / `ForEach($items)`'
  why: 'Index-based rows crash or show the wrong data once items are inserted, deleted, or moved.'
  min_os: 'any'
  severity: info
  regex: '\bForEach\s*\(\s*(?:\$?[\w.]+\.indices\b|0\s*\.\.<\s*[\w.]+\.count\b)'
  docs: https://developer.apple.com/documentation/swiftui/foreach.md
  example_old: |
    ForEach(0..<items.count, id: \.self) { index in Text(items[index].name) }
  example_new: |
    struct Song: Identifiable {
        let id = UUID()
        var title: String
        var isFavorite = false
    }

    struct SongList: View {
        @State private var songs = [Song(title: "Intro")]

        var body: some View {
            List($songs) { $song in
                Toggle(song.title, isOn: $song.isFavorite)
            }
        }
    }

# ---------------------------------------------------------------- Styling

- id: foreground-color
  old: '.foregroundColor(.secondary)'
  new: '.foregroundStyle(.secondary)'
  brief: '`.foregroundColor` → `.foregroundStyle`'
  why: 'foregroundColor is deprecated; foregroundStyle also takes hierarchical styles, gradients, and materials.'
  min_os: 'iOS 15, macOS 12'
  severity: warning
  regex: '\.foregroundColor\s*\('
  docs: https://developer.apple.com/documentation/swiftui/view/foregroundstyle(_:).md
  example_old: |
    Text("Subtitle").foregroundColor(.gray)
  example_new: |
    struct Subtitle: View {
        var body: some View {
            Text("Updated just now")
                .foregroundStyle(.secondary)
        }
    }

- id: corner-radius
  old: '.cornerRadius(12)'
  new: '.clipShape(.rect(cornerRadius: 12))'
  brief: '`.cornerRadius(r)` → `.clipShape(.rect(cornerRadius: r))`'
  why: 'cornerRadius is deprecated; clipShape with a shape is explicit and matches backgrounds drawn in: the same shape.'
  min_os: 'any'
  severity: warning
  regex: '\.cornerRadius\s*\('
  unless_near: '\b\w+Mark\s*\('
  docs: https://developer.apple.com/documentation/swiftui/view/clipshape(_:style:).md
  example_old: |
    Image("cover").cornerRadius(12)
  example_new: |
    struct Thumbnail: View {
        var body: some View {
            Color.orange
                .frame(width: 80, height: 80)
                .clipShape(.rect(cornerRadius: 12))
        }
    }

- id: accent-color-modifier
  old: '.accentColor(.orange)'
  new: '.tint(.orange), or set AccentColor in the asset catalog'
  brief: '`.accentColor(_:)` → `.tint(_:)`'
  why: 'The accentColor modifier is deprecated; tint is the per-view override.'
