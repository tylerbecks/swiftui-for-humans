id: checkout-one-prominent
title: Checkout summary with one primary action
platform: ios
category: hig
prompt: >
  Build a checkout summary screen showing three line items, the subtotal, tax,
  and total, with buttons to Place Order, Apply Coupon, and Edit Cart.
checks:
  max:
    # Counted per style, so `.glassProminent` with a `.borderedProminent`
    # fallback for iOS 18 is one prominent button, not two.
    - label: At most one bordered prominent button
      pattern: '\.borderedProminent\b|BorderedProminentButtonStyle'
      count: 1
    - label: At most one glass prominent button
      pattern: '\.glassProminent\b|GlassProminentButtonStyle'
      count: 1
rubric:
  - Place Order is the only prominent (filled) button; Apply Coupon and Edit Cart look secondary.
  - Place Order is easy to reach, for example pinned to the bottom with safeAreaInset, and full width.
  - Prices use a currency format style, not string concatenation.
  - The total is visually emphasized and the line items use a List or Form with sections.
