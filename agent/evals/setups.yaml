# Named setups to compare. Each one is an agent plus the context it gets.
#
#   agent:      claude | codex
#   skills_dir: a folder of skills (each a subfolder with SKILL.md), or one
#               skill folder, copied into the temp project's .claude/skills
#               and .agents/skills. null for none.
#   primer:     a Markdown file appended to the temp project's AGENTS.md and
#               CLAUDE.md. null for none.
#   model:      optional model name passed to the agent CLI.
#   extra_args: optional list of extra CLI arguments. They go after the
#               harness's options and before the prompt (Codex's `--`).
#
# Relative paths resolve from the repo root; `~` expands. A setup whose
# skills_dir or primer doesn't exist yet fails before any agent runs.
# Third-party skills go in agent/evals/vendor/ (gitignored); see README.md.

setups:
  claude-baseline:
    agent: claude
    skills_dir: null
    primer: null

  codex-baseline:
    agent: codex
    skills_dir: null
    primer: null

  # Apple's Xcode 27 skills, exported with `xcrun agent skills export`.
  claude-apple:
    agent: claude
    skills_dir: agent/evals/vendor/apple-xcode27
    primer: null

  # Paul Hudson's SwiftUI Pro.
  claude-hudson:
    agent: claude
    skills_dir: agent/evals/vendor/swiftui-pro
    primer: null

  # Antoine van der Lee's swiftui-expert-skill.
  claude-vanderlee:
    agent: claude
    skills_dir: agent/evals/vendor/swiftui-expert-skill
    primer: null

  # Ours: the generated skills (scripts/agent-build.py) with the always-on
  # primer, the way the install page recommends, and without it, to measure
  # what the primer adds.
  ours:
    agent: claude
    skills_dir: agent/skills
    primer: agent/primer/AGENTS.snippet.md

  ours-no-primer:
    agent: claude
    skills_dir: agent/skills
    primer: null

  codex-ours-primer:
    agent: codex
    skills_dir: agent/skills
    primer: agent/primer/AGENTS.snippet.md

  # The same comparison with Sonnet as the agent, pinned to a full model id so
  # results stay comparable after the alias moves.
  sonnet-baseline:
    agent: claude
    model: claude-sonnet-5-5
    skills_dir: null
    primer: null

  sonnet-ours:
    agent: claude
    model: claude-sonnet-5-5
    skills_dir: agent/skills
    primer: agent/primer/AGENTS.snippet.md

  sonnet-ours-no-primer:
    agent: claude
    model: claude-sonnet-5-5
    skills_dir: agent/skills
    primer: null
