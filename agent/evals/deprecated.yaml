# Deprecated or outdated APIs that models still write. The scorer counts
# matches of each pattern in the Swift files of every run (comments are
# stripped first). Patterns are Python regular expressions; keep them in
# single quotes. These are a scoring aid for the evals, not the linter the
# skill will ship (that comes from agent/src/corrections.yaml in phase 2).
#
# The compiler's own deprecation warnings are counted separately, but they
# miss most of these: Xcode 27's SwiftUI marks NavigationView,
# foregroundColor, cornerRadius, navigationBarTitle, and the rest as
# deprecated "in a future version", which never warns (checked October 2026).
# Only hard deprecations like UIApplication.shared.windows warn. So this list
# is the main deprecation measure.

patterns:
  - id: navigation-view
    pattern: '\bNavigationView\b'
    use: NavigationStack or NavigationSplitView

  - id: navigation-link-is-active
    pattern: 'NavigationLink\([^)]*isActive:'
    use: navigationDestination(isPresented:) or a NavigationStack path

  - id: observable-object
    pattern: '\bObservableObject\b'
    use: the @Observable macro

  - id: published
    pattern: '@Published\b'
    use: plain stored properties in an @Observable class

  - id: state-object
    pattern: '@StateObject\b'
    use: '@State with an @Observable class'

  - id: observed-object
    pattern: '@ObservedObject\b'
    use: a plain property, or @Bindable for bindings

  - id: environment-object
    pattern: '@EnvironmentObject\b|\.environmentObject\('
    use: '@Environment(Model.self) and .environment(model)'

  - id: onchange-one-parameter
    pattern: '\.onChange\(of:[^)]*\)\s*\{\s*(?:\[[^\]]*\]\s*)?\w+\s+in\b'
    use: 'onChange(of:) { oldValue, newValue in } or the zero-parameter form'

  - id: preview-provider
    pattern: '\bPreviewProvider\b'
    use: the #Preview macro

  - id: action-sheet
    pattern: '\bActionSheet\b|\.actionSheet\('
    use: confirmationDialog

  - id: alert-struct
    pattern: '\bAlert\('
    use: '.alert(_:isPresented:actions:message:)'

  - id: presentation-mode
    pattern: '\bpresentationMode\b'
    use: '@Environment(\.dismiss)'

  - id: foreground-color
    pattern: '\.foregroundColor\('
    use: foregroundStyle

  - id: corner-radius
    pattern: '\.cornerRadius\('
    use: 'clipShape(.rect(cornerRadius:))'

  - id: accent-color-modifier
    pattern: '\.accentColor\('
    use: tint

  - id: navigation-bar-title
    pattern: '\.navigationBarTitle\('
    use: navigationTitle

  - id: navigation-bar-items
    pattern: '\.navigationBarItems\('
    use: toolbar

  - id: edges-ignoring-safe-area
    pattern: '\.edgesIgnoringSafeArea\('
    use: ignoresSafeArea

  - id: autocapitalization
    pattern: '\.autocapitalization\('
    use: textInputAutocapitalization

  - id: disable-autocorrection
    pattern: '\.disableAutocorrection\('
    use: autocorrectionDisabled

  - id: text-concatenation
    pattern: '\bText\([^)]*\)\s*\+\s*Text\('
    use: string interpolation in one Text

  - id: uiscreen-main
    pattern: '\bUIScreen\.main\b'
    use: GeometryReader, containerRelativeFrame, or size classes

  - id: shared-windows
    pattern: 'UIApplication\.shared\.windows\b'
    use: the scene's window, or SwiftUI environment values

  - id: dispatch-main-async
    pattern: '\bDispatchQueue\.main\.async'
    use: '.task and @MainActor'

  - id: sk-store-review-controller
    pattern: '\bSKStoreReviewController\b'
    use: '@Environment(\.requestReview)'
